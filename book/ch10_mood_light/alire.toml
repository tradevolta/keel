name = "ch10_mood_light"
description = "Chapter 10: an RGB mood light, a servo sweeper and a frequency meter"
version = "0.3.0-dev"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "keel"]

executables = ["mood_light"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# Keel's startup: its vector table carries keel_isr_0 (the meter's
# gate) and keel_isr_3 (Keel.Time.Bare's wake-up alarm).
keel_rp2350.Startup = "keel"
