name = "ch13_thermo_strip"
description = "Chapter 13: two DS18B20s on PIO 1-Wire, shown on WS2812s"
version = "0.3.0"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "pio", "keel"]

executables = ["thermo_strip"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_drivers = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_drivers = { path = "../../crates/keel_drivers" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# Keel's startup: its vector table carries keel_isr_3, Keel.Time.Bare's
# wake-up alarm. The PIO is polled: no PIO interrupt is used.
keel_rp2350.Startup = "keel"
