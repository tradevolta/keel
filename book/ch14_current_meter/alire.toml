name = "ch14_current_meter"
description = "Chapter 14: a second Pico reads an INA219 to log current"
version = "0.3.0-dev"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "ina219", "keel"]

executables = ["current_meter"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_drivers = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_drivers = { path = "../../crates/keel_drivers" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
keel_rp2350.Startup = "keel"
