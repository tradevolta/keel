name = "ch16_pocket_dashboard_nucleo"
description = "Chapter 16, NUCLEO-G474RE: the pocket dashboard on SPI1"
version = "0.5.0-dev"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "stm32g4", "nucleo", "spi", "display", "keel"]

executables = ["pocket_dashboard"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_stm32g4xx = "=16.0.0"
keel_core = "*"
keel_cli = "*"
keel_drivers = "*"
keel_log = "*"
keel_stm32g4 = "*"
keel_stm32g4_svd = "*"
keel_ui = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_cli = { path = "../../crates/keel_cli" }
keel_drivers = { path = "../../crates/keel_drivers" }
keel_log = { path = "../../crates/keel_log" }
keel_stm32g4 = { path = "../../crates/keel_stm32g4" }
keel_stm32g4_svd = { path = "../../crates/keel_stm32g4_svd" }
keel_ui = { path = "../../crates/keel_ui" }

[configuration.values]
light_stm32g4xx.MCU_Sub_Family = "G474"
light_stm32g4xx.MCU_Flash_Memory_Size = "E"
# Keel's startup: its vector table carries keel_isr_91, the LPUART1
# handler, keel_isr_12, DMA1 channel 2's, and keel_systick,
# Keel.Time.Bare's tick
keel_stm32g4.Startup = "keel"
