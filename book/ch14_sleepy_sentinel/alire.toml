name = "ch14_sleepy_sentinel"
description = "Chapter 14: a sentinel that sleeps, logs and survives hangs"
version = "0.3.0"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "low-power", "keel"]

executables = ["sleepy_sentinel"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

# The deepest mode the sentinel waits in between readings: one build
# for each row of the current table
[configuration.variables]
Deepest = { type = "Enum", values = ["Run", "Sleep", "Dormant", "Power_Down"], default = "Sleep" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# Keel's startup: its vector table carries keel_isr_3, Keel.Time.Bare's
# wake-up alarm
keel_rp2350.Startup = "keel"
ch14_sleepy_sentinel.Deepest = "Sleep"
