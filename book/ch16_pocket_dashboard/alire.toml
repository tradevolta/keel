name = "ch16_pocket_dashboard"
description = "Chapter 16: a pocket dashboard on a 240x240 ST7789 over SPI"
version = "0.5.0-dev"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "spi", "display", "keel"]

executables = ["pocket_dashboard"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_cli = "*"
keel_drivers = "*"
keel_log = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"
keel_ui = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_cli = { path = "../../crates/keel_cli" }
keel_drivers = { path = "../../crates/keel_drivers" }
keel_log = { path = "../../crates/keel_log" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }
keel_ui = { path = "../../crates/keel_ui" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# Keel's startup: its vector table carries keel_isr_33, the UART0
# handler, keel_isr_10, the DMA's, and keel_isr_3, Keel.Time.Bare's
# alarm
keel_rp2350.Startup = "keel"
