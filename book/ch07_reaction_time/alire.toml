name = "ch07_reaction_time"
description = "Chapter 7: a reaction-time game on the Keel.GPIO HAL"
version = "0.1.0"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "keel"]

executables = ["reaction_time"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# The runtime's startup runs the 12 MHz crystal and the PLLs, so
# clk_ref is a known 12 MHz, as in Chapter 6.
keel_rp2350.Startup = "runtime"
