name = "ch09_volume_knob"
description = "Chapter 9: a rotary encoder in an interrupt, and a fault report"
version = "0.2.0-dev"
authors = ["Vincent Donkor"]
licenses = "Apache-2.0"
website = "https://github.com/tradevolta/keel"
tags = ["embedded", "rp2350", "pico2w", "keel"]

executables = ["volume_knob"]

[[depends-on]]
gnat_arm_elf = "=16.1.0"
light_rp2350 = "=16.0.0"
keel_core = "*"
keel_rp2350 = "*"
keel_rp2350_svd = "*"

[[pins]]
keel_core = { path = "../../crates/keel_core" }
keel_rp2350 = { path = "../../crates/keel_rp2350" }
keel_rp2350_svd = { path = "../../crates/keel_rp2350_svd" }

[configuration.values]
light_rp2350.Board = "rpi_pico2"
# Keel's startup: its vector table carries keel_isr_21 and its
# HardFault handler prints the fault report.
keel_rp2350.Startup = "keel"
